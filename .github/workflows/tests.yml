name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/resume-v2/requirements.lock.txt
      - run: python -m pip install -r docs/resume-v2/requirements.lock.txt
      - run: python -m pytest -q -p no:cacheprovider --tb=short
