<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG 证据复核</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193044;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#143349;color:white;padding:24px 32px}h1{font-size:24px;margin:0 0 10px}.sub{color:#c6d8e4;font-size:14px;line-height:1.6}.bar{padding:14px 26px;display:flex;gap:12px;align-items:center;background:white;border-bottom:1px solid #dce3e9}.bar span{flex:1}button,select{font:inherit;padding:8px 12px;border:1px solid #ccd7df;border-radius:6px;background:white;cursor:pointer}button.primary{color:white;background:#1b607d;border-color:#1b607d}main{display:grid;grid-template-columns:245px 1fr;max-width:1500px;margin:auto;min-height:75vh}nav{padding:20px 12px;border-right:1px solid #dce3e9;height:calc(100vh - 180px);overflow:auto}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:13px}nav button.active{background:#e3edf4;border-color:#397292}article{padding:24px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #dce3e9;border-radius:10px;padding:20px;margin-bottom:18px}.card h2{font-size:16px;margin:0 0 12px}.content{white-space:pre-wrap;line-height:1.7;font-size:14px;overflow-wrap:anywhere}.tag{display:inline-block;padding:4px 8px;border-radius:5px;background:#e8eef2;font-size:12px;margin-right:8px}.warn{background:#fff1d7;color:#764711}.muted{color:#5e7281;font-size:13px}a{color:#1b607d}details{margin:10px 0}summary{cursor:pointer;color:#1b607d}label{display:block;line-height:1.7;margin:9px 0;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{border-left:4px solid #d9a24b;background:#fff8e9;padding:12px;line-height:1.7;font-size:14px}.empty{padding:40px;color:#687d8c} @media(max-width:900px){main{grid-template-columns:190px 1fr}.grid{grid-template-columns:1fr}header{padding:20px}.bar{flex-wrap:wrap}article{padding:14px}}
</style>
<header><h1>RAG 题集 · 证据复核</h1><div class="sub">查看问题、参考答案、教材证据与模型评估。AI 复核不会自动变成人工审核；不收集姓名或个人信息。</div></header>
<div class="bar"><select id="filter"><option value="priority">优先复核</option><option value="all">全部 60 题</option><option value="eval">评测集</option><option value="dev">开发集</option></select><span id="stats"></span><button id="import">恢复审核文件</button><button id="export" class="primary">导出人工决定</button><input id="file" type="file" accept="application/json" hidden></div>
<main><nav id="list"></nav><article id="detail"></article></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);let current=null;const decisions={};
const $=id=>document.getElementById(id), node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
function priority(q){return (q.medical_review&&q.medical_review.decision!=='retain_with_scope')||q.triage?.status==='needs_review'||!!q.assistant_finding||q.audit?.verdict!=='supported'||q.answer?.judge?.unsupported_claims||q.answer?.judge?.correctness<2||!q.original_pass;}
function renderList(){const f=$('filter').value;const rows=D.items.filter(q=>f==='all'||f==='priority'&&priority(q)||q.split===f);$('list').replaceChildren();for(const q of rows){const b=node('button',q.id+' · '+q.split+(priority(q)?' 需复核':''),q.id===current?'active':'');b.onclick=()=>{current=q.id;renderList();renderDetail(q)};$('list').append(b)}$('stats').textContent=`AI 复核 ${D.items.length} 题 · 人工接受 ${Object.values(decisions).filter(x=>x.decision==='accept').length} 题 · 当前 ${rows.length} 题`;if(!rows.some(q=>q.id===current)&&rows.length){current=rows[0].id;renderList();renderDetail(rows[0]);}else if(!rows.length){$('detail').replaceChildren(node('div','当前没有匹配项','empty'));}}
function card(title,text){const c=node('section',undefined,'card');c.append(node('h2',title),node('div',text,'content'));return c;}
function renderDetail(q){const a=$('detail');a.replaceChildren();const title=node('h2',q.id);title.append(node('span',q.split,'tag'),node('span','待人工审核','tag warn'));a.append(title);const grid=node('div',undefined,'grid');grid.append(card('问题（英文）',q.question),card('参考答案（候选，未经专家审核）',q.reference));a.append(grid);
if(q.medical_review){a.append(card('v3 逐题医学证据复核 · AI 助手',q.medical_review.decision+'\n'+q.medical_review.reason_zh));a.append(card('v3 候选问题与参考答案 · 未重新评分',q.medical_candidate.question+'\n\n'+q.medical_candidate.expected_answer));if(q.medical_review.hold_reason)a.append(card('暂缓评分',q.medical_review.hold_reason));}
if(q.assistant_finding){a.append(card('助手重点复核 · 非人工或专家审核',q.assistant_finding.reason),card('后续修订建议 · 原评测题保持冻结',q.assistant_finding.proposal));}
if(q.triage)a.append(card('证据质量检查 · 仅用于筛选待复核项',q.triage.status+'\n'+q.triage.reasons.join('\n')));
if(q.draft)a.append(card('v2 修订草稿 · 未重新评分、未经人工审核',q.draft.question+'\n\n'+q.draft.expected_answer));
const audit=q.audit||{};a.append(card('AI 证据复核 · '+(audit.verdict||'未完成'),audit.reason||'无'));if(audit.suggested_answer)a.append(card('模型建议修改 · 未自动替换原答案',audit.suggested_answer));
const sources=card('标注来源与相邻上下文','');for(const e of q.sources){const d=node('details');d.open=e.gold;d.append(node('summary',(e.gold?'标注证据':'相邻上下文')+' · '+e.file+' · PDF 第 '+e.page+' 页'));d.append(node('div',e.text,'content'));const link=node('a','打开原始 PDF');link.href='/pdf/'+encodeURIComponent(e.file)+'#page='+e.page;link.target='_blank';link.rel='noopener';d.append(link);sources.append(d)}a.append(sources);
if(q.answer){a.append(card('系统实际回答（中文）',q.answer.answer));a.append(card('回答质量模型判定',JSON.stringify(q.answer.judge,null,2)));const c=card('回答时实际检索到的证据','');q.retrieved.forEach((e,i)=>{const d=node('details');d.append(node('summary','['+(i+1)+'] '+e.file+' · 第 '+e.page+' 页'),node('div',e.text,'content'));c.append(d)});a.append(c)}
const c=card('可选：真实审核者逐题确认','');c.append(node('div','此人工入口对应原始 v1 题目，不对应 v2/v3 草稿。如果你不能确认证据或医学含义，请选“需专业复核”。这里的接受仅表示本人核对过来源，不代表医学专家认证。AI 不会替你点击。','notice'));const checks={};for(const [key,label] of [['source_checked','我已阅读来源，确认问题前提得到支持'],['reference_checked','我已核对答案中的数值、单位与关键结论'],['labels_checked','我已检查证据标签，并考虑是否漏标其他相关证据']]){const l=node('label');const input=node('input');input.type='checkbox';input.checked=!!decisions[q.id]?.[key];checks[key]=input;l.append(input,document.createTextNode(' '+label));c.append(l)}const actions=node('div',undefined,'actions');for(const [value,label] of [['accept','接受此题'],['revise','需要修改'],['specialist','需专业复核']]){const b=node('button',label,value==='accept'?'primary':'');b.onclick=()=>{if(value==='accept'&&!Object.values(checks).every(x=>x.checked)){alert('接受前需要完成三项实际核对；不确定时请选择需专业复核。');return;}decisions[q.id]={question_id:q.id,item_sha256:q.item_sha256,decision:value,...Object.fromEntries(Object.entries(checks).map(([k,v])=>[k,v.checked]))};status.textContent='已暂存决定：'+label+'。请导出文件保存。';renderList();};actions.append(b)}const status=node('p',decisions[q.id]?'当前决定：'+decisions[q.id].decision:'尚无人工决定','muted');c.append(actions,status);a.append(c);}
$('filter').onchange=renderList;
$('export').onclick=()=>{const payload={schema_version:1,actor:'human',dataset_sha256:D.dataset_sha256,decisions:Object.values(decisions)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=node('a');a.href=URL.createObjectURL(blob);a.download='human-review-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const p=JSON.parse(await $('file').files[0].text());if(p.dataset_sha256!==D.dataset_sha256||p.actor!=='human'||!Array.isArray(p.decisions))throw Error();for(const d of p.decisions){const q=D.items.find(x=>x.id===d.question_id);if(!q||q.item_sha256!==d.item_sha256)throw Error();}p.decisions.forEach(d=>decisions[d.question_id]=d);renderList();renderDetail(D.items.find(q=>q.id===current));}catch(e){alert('文件不匹配或格式无效。');}};
renderList();
</script></html>
